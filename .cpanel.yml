---
# cPanel Git Version Control → "Deploy HEAD Commit" runs these tasks.
# Copies the pre-built Node.js app into the "Application root" of the app
# created in "Setup Node.js App" (here: ~/moroccanwebworkers) and restarts it.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/moroccanwebworkers/
    - mkdir -p $DEPLOYPATH
    - /bin/cp -R cpanel-app/. $DEPLOYPATH
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt
