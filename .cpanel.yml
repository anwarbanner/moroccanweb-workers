---
# cPanel Git Version Control → "Deploy HEAD Commit" runs these tasks.
# It copies the pre-built Node.js app into ~/mww-site (the "Application root"
# of your app in "Setup Node.js App") and restarts it.
deployment:
  tasks:
    - export DEPLOYPATH=$HOME/mww-site/
    - mkdir -p $DEPLOYPATH
    - /bin/cp -R cpanel-app/. $DEPLOYPATH
    - mkdir -p $DEPLOYPATH/tmp
    - touch $DEPLOYPATH/tmp/restart.txt
